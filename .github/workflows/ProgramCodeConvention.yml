name: Program Code Convention
on:
  push:
    branches: laboratory-work-4
  workflow_dispatch:
jobs:
  ProgramCodeLinter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: [ProgramCode.dart, ProgramCodeModified.dart]
    steps:
      - name: Checkout Code in Repository
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed $GITHUB_WORKSPACE/3-SoftwareConstruction/3.1-GitHubActions/${{ matrix.file }}
      - name: Analyze Code
        run: dart analyze --fatal-infos $GITHUB_WORKSPACE/3-SoftwareConstruction/3.1-GitHubActions/${{ matrix.file }}
