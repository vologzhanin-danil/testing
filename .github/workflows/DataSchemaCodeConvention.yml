name: Data Schema Code Convention
on:
  push:
  workflow_dispatch:
jobs:
  # Експеримент 1: вихідний файл, перевірка має пройти успішно
  DataSchemaLinter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code in Repository
        uses: actions/checkout@v4
      - name: Start SQL Linter
        run: |
          pip install sqlfluff
          sqlfluff lint $GITHUB_WORKSPACE/DataSchema.sql --dialect postgres

  # Експеримент 2: змінений файл, перевірка має завершитись помилками
  DataSchemaModifiedLinter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code in Repository
        uses: actions/checkout@v4
      - name: Start SQL Linter
        run: |
          pip install sqlfluff
          sqlfluff lint $GITHUB_WORKSPACE/DataSchemaModified.sql --dialect postgres
